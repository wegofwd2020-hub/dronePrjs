[project]
name = "dronePrjs"
version = "0.0.0"
description = "Umbrella project for closedSpace and openSpace drone applications."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML",
    "types-jsonschema",
]

# The umbrella has multiple sibling packages (closedSpace, openSpace, engine);
# setuptools can't auto-discover them, so list the roots explicitly. find:
# silently skips roots that don't yet have an __init__.py.
[tool.setuptools.packages.find]
include = ["closedSpace*", "openSpace*", "engine*"]

# pytest needs the project root on sys.path so `from closedSpace.map import load`
# resolves without an editable install.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "engine/tests",
    "closedSpace/tests",
    "openSpace/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
# Strict-type-check source only; tests stay under ruff but not mypy.
# Common industry convention — test code uses dynamic fixtures and patching
# patterns that don't repay strict typing.
files = ["closedSpace", "engine", "openSpace"]
exclude = ["tests/"]
